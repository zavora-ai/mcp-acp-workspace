server_id = "mcp_acp_workspace"
display_name = "Acp Workspace"
version = "1.3.0"
domain = "agents"
sdk_version = "0.2.0"
risk_level = "medium"
writes_allowed = "gated"
transports = ["stdio"]
credentials = []
governance_gates = ["code_review"]
environments = ["development", "staging", "production"]

[[tools]]
name = "list_acp_connections"
description = "Show registered ACP clients and servers"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "create_acp_session"
description = "Start ACP session in a workspace (sends initialize + session/new over ACP wire)"
risk_class = "internal_write"
requires_approval = false
credential_bindings = []

[[tools]]
name = "send_acp_prompt"
description = "Delegate task to ACP-compatible agent (sends session/prompt with ContentBlock[])"
risk_class = "internal_write"
requires_approval = false
credential_bindings = []

[[tools]]
name = "stream_acp_events"
description = "Get streaming session/update events (preserves full ACP params.update payload)"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "request_acp_permission"
description = "Handle permission request from coding agent — evaluate against governance policy"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "get_acp_patch"
description = "Retrieve proposed file changes from session (platform-derived aggregation from tool-call content, not core ACP)"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "review_acp_patch"
description = "Approve, reject, or annotate a proposed patch"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "terminate_acp_session"
description = "Stop ACP session and capture trace (sends session/cancel notification on wire)"
risk_class = "internal_write"
requires_approval = false
credential_bindings = []

[[tools]]
name = "expose_adk_agent_as_acp"
description = "Publish ADK-Rust agent as ACP-compatible server (usable from VS Code, Claude Desktop)"
risk_class = "read_only"
requires_approval = false
credential_bindings = []
